<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Validation Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #f97fd4, #8fb0f9);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        width: 350px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background-color: #5b86e5;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #3b5edb;
    }

    .error {
        color: red;
        font-size: 14px;
        margin-top: 5px;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Registration Form</h2>

    <form onsubmit="return validateForm()">
        <input type="text" placeholder="Enter Name" required><br>
        <input type="email" id="email" placeholder="Enter Email"><br>
        <div id="errorMsg" class="error"></div>
        <button type="submit">Register</button>
    </form>
</div>

<script>
function validateForm() {
    let email = document.getElementById("email").value;
    let errorMsg = document.getElementById("errorMsg");

    // Simple email regex
    let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if (!pattern.test(email)) {
        errorMsg.innerHTML = "Please enter a valid email address";
        return false; // Stops form submission
    }

    errorMsg.innerHTML = "";
    alert("Form submitted successfully!");
    return true;
}
</script>

</body>
</html>
