<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Strength Checker</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #66ff9c, #fc6ed6);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        width: 350px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
        margin-bottom: 20px;
    }

    input {
        width: 90%;
        padding: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .strength {
        margin-top: 10px;
        font-weight: bold;
    }

    .weak {
        color: red;
    }

    .medium {
        color: orange;
    }

    .strong {
        color: green;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Password Strength Checker</h2>

    <input type="password" id="password" placeholder="Enter Password" onkeyup="checkStrength()">

    <div id="result" class="strength"></div>
</div>

<script>
function checkStrength() {
    let password = document.getElementById("password").value;
    let result = document.getElementById("result");

    let strength = 0;

    if (password.length >= 6) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[@$!%*?&]/.test(password)) strength++;

    if (password.length === 0) {
        result.innerHTML = "";
    } 
    else if (strength <= 1) {
        result.innerHTML = "Weak Password";
        result.className = "strength weak";
    } 
    else if (strength === 2 || strength === 3) {
        result.innerHTML = "Medium Password";
        result.className = "strength medium";
    } 
    else {
        result.innerHTML = "Strong Password";
        result.className = "strength strong";
    }
}
</script>

</body>
</html>
